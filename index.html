<style>
:root{
  /* palette taken from the 2D map */
  --paper:#FBFBF9; --ink:#141414; --ink2:#2A2A2A; --g1:#6B6B6B; --g2:#9A9A9A; --rule:#D6D6D6;
  --gaza:#F2D13A; --view:#FF272B; --proj:#26FF00;
  --mono:'IBM Plex Mono', ui-monospace, monospace; --sans:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden}
#scene,#labels{position:fixed;inset:0}
#labels{pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}

#title{position:fixed;top:26px;left:30px;pointer-events:none}
#title h1{margin:0;font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.16em}
#title p{margin:6px 0 0;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--g1)}
#north{position:fixed;top:24px;right:30px;font-family:var(--mono);font-size:11px;font-weight:600;text-align:center;line-height:1;pointer-events:none}
#north svg{display:block;margin:0 auto 3px}

#bar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--ink);padding:3px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
#bar button{padding:7px 11px}
#bar button:hover{background:#efefec}
#bar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#bar .sep{width:1px;align-self:stretch;background:var(--rule);margin:3px 4px}
#explode{font-weight:600}

#legend{position:fixed;right:30px;bottom:24px;border:1px solid var(--ink);background:var(--paper);padding:9px 12px 10px;font-family:var(--mono);font-size:10px;display:flex;flex-direction:column;gap:6px;min-width:250px}
#legend b{font-weight:700;letter-spacing:.1em;font-size:9.5px}
#legend button{display:flex;align-items:center;gap:9px;text-align:left;transition:opacity .2s}
#legend button[aria-pressed="false"]{opacity:.3}
#legend svg{flex:none}

#hint{position:fixed;left:30px;bottom:26px;font-family:var(--mono);font-size:10px;color:var(--g1);letter-spacing:.04em;line-height:1.6;pointer-events:none}

.era{background:var(--paper);padding:0 8px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--ink);white-space:nowrap;transition:opacity .4s}
.band{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.2em;color:var(--ink);white-space:nowrap;transition:opacity .4s}

#lightbox{position:fixed;inset:0;background:rgba(251,251,249,.94);display:none;align-items:center;justify-content:center;padding:40px;z-index:10;cursor:zoom-out}
#lightbox.on{display:flex}
#lightbox img{max-width:min(90vw,1100px);max-height:84vh;border:1px solid var(--ink)}

#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--g1);background:var(--paper);transition:opacity .6s;z-index:20}

@media (max-width:820px){
  #legend,#hint{display:none}
  #bar{bottom:16px;font-size:9.5px}
  #bar button{padding:7px 8px}
}
</style>

</script>

{

      if (TH[k].tube) obj = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshBasicMaterial({ color: TH[k].col }));
      else { obj = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(1, 0, 0)]), new THREE.LineDashedMaterial({ color: TH[k].col, dashSize: 14, gapSize: 9 })); }
      obj.renderOrder = 1;
      grp.add(obj); segs.push({ obj, a: byId[ids[i]], b: byId[ids[i + 1]] });
    }
    // knots where the yellow thread touches a card
    const knots = [];
    if (false) for (const id of ids) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 12), new THREE.MeshBasicMaterial({ color: C.gaza }));
      const r = new THREE.Mesh(new THREE.SphereGeometry(7.3, 16, 12), new THREE.MeshBasicMaterial({ color: 0x141414, side: THREE.BackSide }));
      s.add(r); s.renderOrder = 3; grp.add(s); knots.push({ s, card: byId[id] });
    }
    threads[k] = { grp, segs, knots };
  }
}
const anchor = (k, out) => out.copy(k.node.position);
const A = new THREE.Vector3(), B = new THREE.Vector3();
function updateThreads() {
  for (const k in threads) {
    const T = threads[k];
    T.grp.visible = TH[k].on;
    for (const s of T.segs) {
      anchor(s.a, A); anchor(s.b, B);
      if (TH[k].tube) {
        s.obj.geometry.dispose();
        s.obj.geometry = new THREE.TubeGeometry(new THREE.LineCurve3(A.clone(), B.clone()), 1, TH[k].tube, 6, false);
      } else {
        s.obj.geometry.setFromPoints([A.clone(), B.clone()]); s.obj.computeLineDistances();
      }
    }
    for (const n of T.knots) n.s.position.copy(n.card.mesh.position);
  }
}

// ---------- place everything for the current e
const tmpQ = new THREE.Quaternion(), yawQ = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0);
const stagger = (d, k) => THREE.MathUtils.clamp(k * 1.6 - d * 0.6, 0, 1); // left-to-right ripple
const smooth = t => t * t * (3 - 2 * t);
function layout() {
  for (const s of slabs) {
    const zc = zOf((s.y0 + s.y1) / 2 - 0.0001 + 0.0001), yy = slabY(s.b);
    s.grp.position.set(xOf((FX0 + FX1) / 2), yy, zOf((s.y0 + s.y1) / 2));
    s.lo.position.set(xOf(FX0) - 26, yy, zc);
  }
  if (strip) {
    const kw = smooth(THREE.MathUtils.clamp(e * 1.25, 0, 1));
    wall.position.set(xOf((FX0 + FX1) / 2), slabY(0) + 0.4, zOf(56));
    wall.rotation.x = -(1 - kw) * Math.PI / 2;
    const bh = Math.max(0.01, WALL_H * kw);
    body.scale.y = bh; body.position.y = bh / 2; body.visible = kw > 0.01;
    strip.position.y = bh + STRIP_H / 2; strip.position.z = 0.5;
  }

  for (const I of images) {
    const k = smooth(stagger(I.delay, e));
    const im = I.im;
    I.hinge.position.set(xOf(im.x + im.w / 2), slabY(I.band) + 1 + I.order * 0.02 * (1 - k), zOf(im.y + im.h));
    I.hinge.rotation.x = -(1 - k) * Math.PI / 2;
  }
  for (const K of cards) {
    const k = smooth(stagger(K.delay, e));
    const flatY = slabY(K.band) + 3, z = zOf(K.cy);
    const y = THREE.MathUtils.lerp(flatY, slabY(K.band) + CARD_Y + K.yExtra, k);
    K.mesh.position.set(xOf(K.cx), y, z);
    const yaw = Math.atan2(camera.position.x - K.mesh.position.x, camera.position.z - K.mesh.position.z);
    yawQ.setFromAxisAngle(up, yaw);
    K.mesh.quaternion.slerpQuaternions(qFlat, yawQ, k);
    const base = new THREE.Vector3(xOf(K.cx), slabY(K.band) + 0.8, z);
    K.stem.geometry.setFromPoints([base, new THREE.Vector3(base.x, y, z)]);
    K.dot.position.copy(base); K.dot.material.opacity = k;
    K.node.position.copy(K.mesh.position);
    K.mesh.visible = K.show > 0.01; K.mesh.material.opacity = K.show;
    K.mesh.scale.setScalar(1.5 * (0.9 + 0.1 * K.show));
    if (k > 0.5) K.mesh.position.y += K.h * 0.75 + 16; // caption sits just above its node
  }
  stemMat.opacity = smooth(THREE.MathUtils.clamp(e * 1.3 - 0.3, 0, 1)) * 0.9;
  for (const s of slabs) s.lab.style.opacity = 1;
  updateThreads();
}

// ---------- camera views
const VIEWS = {
  persp: [[-2050, 2250, 3350], [-60, 160, 260]],
  top: [[0, 3900, 1], [0, 0, 0]],
  front: [[0, 1150, 3900], [0, 260, 150]],
  side: [[-3700, 900, 200], [0, 260, 0]],
};
let fly = null;
function flyTo(pos, tgt, ms = 1400) {
  if (reduce) { camera.position.copy(pos); controls.target.copy(tgt); return; }
  fly = { t0: performance.now(), ms, p0: camera.position.clone(), q0: controls.target.clone(), p1: pos, q1: tgt };
}
function setView(v) {
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === v));
  const [p, t] = VIEWS[v]; flyTo(new THREE.Vector3(...p), new THREE.Vector3(...t));
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));


document.querySelectorAll('[data-thread]').forEach(b => b.onclick = () => {
  const k = b.dataset.thread; TH[k].on = !TH[k].on; b.setAttribute('aria-pressed', TH[k].on);
});

// ---------- picking
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let hovered = null, down = null, hoverImg = null;
const link = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(1, 0, 0)]), new THREE.LineDashedMaterial({ color: 0x141414, dashSize: 6, gapSize: 5, transparent: true, opacity: 0, depthTest: false }));
link.renderOrder = 9; scene.add(link);
function pick(ev) {
  mouse.set(ev.clientX / innerWidth * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(cards.filter(k => k.show > 0.5).map(k => k.mesh).concat(cards.map(k => k.node), images.map(i => i.mesh)), false)[0];
  return hit ? hit.object : null;
}
renderer.domElement.addEventListener('pointermove', ev => {
  const o = pick(ev);
  hoverImg = o && o.userData.kind === 'img' ? o : null;
  hovered = !o ? null : o.userData.kind === 'img' ? (byId[D.img2card[o.userData.im.id]] || null) : o.userData.k;
  renderer.domElement.style.cursor = o ? (o.userData.kind === 'img' ? 'zoom-in' : 'pointer') : 'grab';
});
renderer.domElement.addEventListener('pointerdown', ev => down = [ev.clientX, ev.clientY]);
renderer.domElement.addEventListener('pointerup', ev => {
  if (!down || Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 5) return;
  const o = pick(ev); if (!o) return;
  if (o.userData.kind === 'img') { lbImg.src = o.userData.im.file; lb.classList.add('on'); return; }
  const K = o.userData.k, p = K.mesh.position.clone();
  if (e < 0.5) { flyTo(new THREE.Vector3(p.x, 700, p.z + 1), p.clone()); return; }
  const dir = camera.position.clone().sub(p); dir.y = 0; dir.normalize();
  flyTo(p.clone().add(dir.multiplyScalar(Math.max(K.w, K.h * 1.6) * 2.4)).add(new THREE.Vector3(0, 30, 0)), p.clone());
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', false));
});
const lb = document.getElementById('lightbox'), lbImg = document.getElementById('lbImg');
lb.onclick = () => lb.classList.remove('on');
addEventListener('keydown', ev => { if (ev.key === 'Escape') lb.classList.remove('on'); });
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelR.setSize(innerWidth, innerHeight); });

// ---------- loop
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  // explode when the map is tilted, recompose when seen from above
  const pol = controls.getPolarAngle();
  eTarget = THREE.MathUtils.clamp((pol - 0.12) / 0.55, 0, 1);
  if (e !== eTarget) {
    if (reduce) e = eTarget;
    else { const sp = 1.1; e = eTarget > e ? Math.min(eTarget, e + dt * sp) : Math.max(eTarget, e - dt * sp); }
  }
  for (const K of cards) K.show += ((K === hovered ? 1 : 0) - K.show) * (reduce ? 1 : 0.22);
  if (fly) {
    const t = Math.min(1, (now - fly.t0) / fly.ms), q = ease(t);
    camera.position.lerpVectors(fly.p0, fly.p1, q); controls.target.lerpVectors(fly.q0, fly.q1, q);
    if (t >= 1) fly = null;
  }
  controls.update();
  layout();
  if (hoverImg && hovered) {
    const top = hoverImg.localToWorld(new THREE.Vector3(0, hoverImg.userData.im.h / 2, 0));
    link.geometry.setFromPoints([top, hovered.node.position.clone()]); link.computeLineDistances();
    link.material.opacity = Math.min(0.8, hovered.show); link.visible = true;
  } else link.visible = false;
  renderer.render(scene, camera); labelR.render(scene, camera);
  requestAnimationFrame(tick);
}

// ---------- start: flat map seen from above, then it explodes
(async () => {
  try { await Promise.all([document.fonts.load('700 10px "IBM Plex Mono"'), document.fonts.load('500 10px "IBM Plex Mono"'), document.fonts.load('400 10px Inter')]); } catch (_) {}
  buildCards(); buildThreads(); buildWall();
  const [p, t] = VIEWS.top; camera.position.set(...p); controls.target.set(...t);
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === 'top'));
  requestAnimationFrame(tick);
  const ld = document.getElementById('loader'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 700);
})();
</script>
</body>
