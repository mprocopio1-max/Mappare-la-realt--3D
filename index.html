<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappare la realtà</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--ink2:#3a3a3a;--g1:#8a8a86;--paper:#F6F6F3;--gaza:#F2D13A;--sans:'Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 90% at 50% 40%,#FDFDFB 0%,#F3F3EF 60%,#E9E9E4 100%)}
#scene,#labels{position:fixed;inset:0}
#labels{pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

#explore{position:fixed;top:24px;left:24px;z-index:20;background:rgba(255,255,255,.96);color:#141414;border:.6px solid #141414;border-radius:0;padding:9px 14px 9px;font-family:var(--sans);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;display:flex;align-items:center;gap:8px;transition:opacity .6s,background .2s,color .2s}
#explore:hover{background:#141414;color:#fff}
#explore .ic{width:8px;height:8px;border-radius:50%;background:var(--gaza);box-shadow:0 0 0 3px rgba(242,209,58,.25)}
#explore[disabled]{opacity:0;pointer-events:none}

/* hover caption */
#tip{position:fixed;left:0;top:0;z-index:15;pointer-events:none;width:270px;background:rgba(255,255,255,.96);border:.6px solid #141414;padding:9px 11px 11px;opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s}
#tip.on{opacity:1;transform:none}
#tip.pal{border-left:3px solid var(--gaza)}
#tip .d{font-family:var(--mono);font-size:9px;color:#6B6B6B}
#tip .t{font-family:var(--sans);font-weight:700;font-size:11px;text-transform:uppercase;line-height:1.25;margin:3px 0 6px;color:#141414}
#tip .b{font-family:var(--sans);font-size:11.5px;line-height:1.45;color:#2A2A2A}
#tip .tag{display:inline-block;font-family:var(--mono);font-size:8px;font-weight:700;background:#141414;color:#fff;padding:1px 5px;margin:-9px 0 6px -11px}
#tip .pal{display:none}

/* tour */
#tour{position:fixed;left:24px;bottom:24px;z-index:12;width:min(400px,calc(100vw - 48px));background:rgba(255,255,255,.96);border:.6px solid #141414;padding:11px 13px 13px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .45s,transform .45s}
#tour.on{opacity:1;transform:none;pointer-events:auto}
#tour .k{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;font-weight:400;color:#6B6B6B;letter-spacing:.02em;text-transform:uppercase}
#tour h2{margin:4px 0 7px;font-family:var(--sans);font-size:12.5px;line-height:1.25;font-weight:700;text-transform:uppercase;color:#141414}
#tour p{margin:0;font-family:var(--sans);font-size:12px;line-height:1.5;color:#2A2A2A}
#tour .sw{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:7px}
#tour .body{transition:opacity .3s}
#prog{height:2px;background:#E2E2DE;margin-top:12px;overflow:hidden}
#prog i{display:block;height:100%;background:#141414;transition:width .5s}
.arrow{position:fixed;top:50%;z-index:12;width:40px;height:40px;margin-top:-20px;background:rgba(255,255,255,.96);border:.6px solid #141414;border-radius:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s,background .2s}
.arrow.on{opacity:1;pointer-events:auto}
.arrow:hover{background:#141414}
.arrow:hover path{stroke:#fff}
.arrow[disabled]{opacity:.25!important;pointer-events:none}
#prev{left:24px} #next{right:24px}

/* in-tour labels */
.lab{font-family:var(--sans);font-size:9.5px;font-weight:700;text-transform:uppercase;line-height:1.2;background:rgba(255,255,255,.93);border:.6px solid #141414;padding:3px 6px 4px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .35s;pointer-events:none;color:#141414}
.lab.pal{border-left:2.6px solid var(--gaza)}
.lab.on{opacity:1}
.city,.tick,.band{white-space:nowrap;opacity:0;transition:opacity .4s;pointer-events:none;color:#141414}
.city{font-family:var(--mono);font-size:8.8px;font-weight:700;background:#141414;color:var(--gaza);padding:2px 5px}
.tick{font-family:var(--mono);font-size:10px;font-weight:400}
.band{font-family:var(--sans);line-height:1}
.band .c{display:block;font-family:var(--mono);font-size:8.5px;font-weight:400;color:#141414;margin-bottom:2px}
.band .n{display:block;font-size:11.5px;font-weight:700;letter-spacing:.01em}
.city.on,.tick.on,.band.on{opacity:1}

#lightbox{position:fixed;inset:0;z-index:30;background:rgba(246,246,243,.86);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;gap:28px;padding:40px;opacity:0;pointer-events:none;transition:opacity .3s;cursor:zoom-out}
#lightbox.on{opacity:1;pointer-events:auto}
#lightbox img{max-width:min(62vw,900px);max-height:80vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
#lightbox .cap{width:300px}
#lightbox .cap .d{font-family:var(--mono);font-size:11px;color:var(--g1)}
#lightbox .cap .t{font-weight:700;font-size:20px;line-height:1.2;margin:6px 0 10px;letter-spacing:-.01em}
#lightbox .cap .b{font-size:14px;line-height:1.55;color:var(--ink2)}
#lightbox .thumbs{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
#lightbox .thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px;box-shadow:none;cursor:pointer;opacity:.6}
#lightbox .thumbs img.on{opacity:1;outline:2px solid #111}


#compass{position:fixed;top:16px;right:20px;z-index:14;width:64px;height:64px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .6s}
#scale{position:fixed;right:28px;bottom:26px;z-index:14;opacity:0;transition:opacity .6s;pointer-events:none;font-family:var(--mono);font-size:9.5px;color:#141414;text-align:right}
#scale .bar{height:6px;display:flex;margin-left:auto;transition:width .25s}
#scale .bar i{flex:1;background:#141414;border:.8px solid #141414}
#scale .bar i:nth-child(2n){background:#fff}
#scale .lbl{display:flex;justify-content:space-between;margin-top:5px}
#scale .sub{font-size:8.5px;color:#6B6B6B;margin-top:3px}
.ui-on #compass,.ui-on #scale{opacity:1}
#loader{position:fixed;inset:0;z-index:40;background:#F6F6F3;transition:opacity .8s}

@media (max-width:820px){
  #tour{left:12px;right:12px;bottom:12px;width:auto;padding:10px 12px 12px}
  #tour h2{font-size:12px} #tour p{font-size:11.5px}
  .arrow{top:40%;width:38px;height:38px} #prev{left:10px} #next{right:10px}
  #tip{display:none}
  #lightbox{flex-direction:column;gap:16px;overflow:auto} #lightbox img{max-width:90vw;max-height:50vh} #lightbox .cap{width:auto;max-width:90vw}
}
</style>

<body>
<div id="scene" aria-label="Mappa 3D della Striscia di Gaza in strati: trascina per ruotare, rotella per lo zoom"></div>
<div id="labels"></div>
<div id="loader"></div>
<button id="explore" disabled><span id="exploreTxt">Esplora</span></button>
<div id="tip" role="tooltip"></div>
<button id="compass" aria-label="Bussola: clicca per orientare la mappa con il nord in alto"><svg width="64" height="64" viewBox="-32 -32 64 64" style="overflow:visible"><g id="needle"><path d="M-10 14 L0 -14 L10 14 L0 7 Z" fill="#141414"/></g><text id="nLetter" x="0" y="-19" text-anchor="middle" dominant-baseline="middle" font-family="Inter, sans-serif" font-weight="700" font-size="14" fill="#141414">N</text></svg></button>
<div id="scale" aria-label="Scala"><div class="bar"><i></i><i></i><i></i><i></i><i></i></div><div class="lbl"><span>0</span><span id="scaleTxt">5 km</span></div></div>
<section id="tour" aria-live="polite">
  <div class="body"><div class="k"><span id="tk"></span><span id="tn"></span></div><h2 id="tt"></h2><p id="tp"></p></div>
  <div id="prog"><i></i></div>
</section>
<button class="arrow" id="prev" aria-label="Passo precedente"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M11 3.5L5.5 9L11 14.5" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="square" stroke-linejoin="miter"/></svg></button>
<button class="arrow" id="next" aria-label="Passo successivo"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M7 3.5L12.5 9L7 14.5" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="square" stroke-linejoin="miter"/></svg></button>
<div id="lightbox" role="dialog" aria-label="Immagine"><img alt=""><div class="cap"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const D = window.DATA, G = D.geo, WT = G.WT, DEP = G.DEP;
const COL = { view: '#FF272B', platform: '#F2D13A', border: '#141414', back: '#2B59FF' };
const THREAD_W = { view: 2.6, platform: 4.2, border: 2.3, back: 2.6 };
const LAYER = [
  { code: 'L05', name: 'TECNOLOGIA' }, { code: 'L04', name: 'RAPPRESENTAZIONE' }, { code: 'L03', name: 'POLITICA' },
  { code: 'L02', name: 'CULTURA' }, { code: 'L01', name: 'PRATICHE' }, { code: 'L00', name: 'GAZA 2023–2026' },
];
const THICK = L => L === 5 ? 46 : 9;
const GAP = 330;

// ---------------------------------------------------------------- setup
const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);
const labelR = new CSS2DRenderer({ element: document.getElementById('labels') });
labelR.setSize(innerWidth, innerHeight);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 10, 40000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.495; controls.minDistance = 250; controls.maxDistance = 9000;
controls.enabled = false;

const state = { gap: 0, gapT: 0, touring: false, step: 0, intro: true };
const introY = [0, 0, 0, 0, 0, 0];
const layerY = L => state.intro ? introY[L] : (5 - L) * state.gap;
const topY = L => layerY(L) + THICK(L);
const W = (u, v, y) => new THREE.Vector3(u - WT / 2, y, v - DEP / 2);

// soft ground shadow
{
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 10, 128, 128, 128); gr.addColorStop(0, 'rgba(0,0,0,.22)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(WT * 1.35, DEP * 2.2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2; m.position.y = -40; scene.add(m);
}

// ---------------------------------------------------------------- slabs
const shape = new THREE.Shape(G.poly.map(([u, v]) => new THREE.Vector2(u - WT / 2, -(v - DEP / 2))));
const loader = new THREE.TextureLoader();
const layers = [];
let pending = 6;
for (let L = 0; L < 6; L++) {
  const geo = new THREE.ExtrudeGeometry(shape, { depth: THICK(L), bevelEnabled: false, curveSegments: 1 });
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) uv.setXY(i, (pos.getX(i) + WT / 2) / WT, 1 - (pos.getZ(i) + DEP / 2) / DEP);
  const tex = loader.load(window.TEX[L], () => { if (--pending === 0) ready(); });
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const topM = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
  const sideM = new THREE.MeshBasicMaterial({ color: L === 5 ? 0x161616 : 0xD3D3CE, transparent: true });
  const mesh = new THREE.Mesh(geo, [topM, sideM]); mesh.userData.L = L;
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), new THREE.LineBasicMaterial({ color: 0x141414, transparent: true, opacity: .35 }));
  const grp = new THREE.Group(); grp.add(mesh, edges); scene.add(grp);
  const el = document.createElement('div'); el.className = 'band'; el.innerHTML = `<span class="c">${LAYER[L].code}</span><span class="n">${LAYER[L].name}</span>`;
  const lab = new CSS2DObject(el); lab.center.set(0, 0.5); scene.add(lab);
  layers.push({ grp, mesh, topM, sideM, edgeM: edges.material, lab, el, op: 1, opT: 1 });
}
// Gaza map on top of the block during the intro
const coverGeo = new THREE.ShapeGeometry(shape); coverGeo.rotateX(-Math.PI / 2);
{ const p = coverGeo.attributes.position, uv = coverGeo.attributes.uv; for (let i = 0; i < p.count; i++) uv.setXY(i, (p.getX(i) + WT / 2) / WT, 1 - (p.getZ(i) + DEP / 2) / DEP); }
const coverM = new THREE.MeshBasicMaterial({ map: layers[5].topM.map, transparent: true, depthWrite: false });
const cover = new THREE.Mesh(coverGeo, coverM); cover.renderOrder = 3; scene.add(cover);
const coverEdge = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(G.poly.map(([u, v]) => W(u, v, 0))), new THREE.LineBasicMaterial({ color: 0x141414, transparent: true }));
scene.add(coverEdge);
const cityLabs = G.cities.map(([n, u, v]) => { const el = document.createElement('div'); el.className = 'city'; el.textContent = n; const o = new CSS2DObject(el); o.center.set(0, 1.3); scene.add(o); return { o, el, u, v }; });
function vMax(u) {
  const P = G.poly; let hits = [];
  for (let i = 0; i < P.length; i++) { const [u1, v1] = P[i], [u2, v2] = P[(i + 1) % P.length]; if ((u1 - u) * (u2 - u) <= 0 && u1 !== u2) hits.push(v1 + (u - u1) / (u2 - u1) * (v2 - v1)); }
  return hits.length ? Math.max(...hits) : DEP / 2;
}
const ticks = G.ticks.map(([y, u]) => { const el = document.createElement('div'); el.className = 'tick'; el.textContent = y; const o = new CSS2DObject(el); o.center.set(0.5, -0.2); scene.add(o); return { o, el, u, v: vMax(u) + 40 }; });

const tickLine = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0x141414, transparent: true, opacity: 0 }));
scene.add(tickLine);
// hover outline for images
const hoverBox = new THREE.LineLoop(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0x111111, transparent: true, opacity: 0, depthTest: false }));
hoverBox.renderOrder = 20; scene.add(hoverBox);

// ---------------------------------------------------------------- markers
function spriteTex(kind) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.translate(64, 64); g.lineJoin = 'round';
  if (kind === 'view') { g.beginPath(); g.arc(0, 0, 34, 0, 7); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 12; g.strokeStyle = COL.view; g.stroke(); }
  else if (kind === 'platform') { g.beginPath(); g.arc(0, 0, 40, 0, 7); g.fillStyle = COL.platform; g.fill(); g.lineWidth = 9; g.strokeStyle = '#141414'; g.stroke(); }
  else if (kind === 'border') { g.fillStyle = '#141414'; g.beginPath(); g.roundRect(-34, -34, 68, 68, 10); g.fill(); }
  else if (kind === 'back') { g.beginPath(); g.moveTo(0, -44); g.lineTo(44, 0); g.lineTo(0, 44); g.lineTo(-44, 0); g.closePath(); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 10; g.strokeStyle = COL.back; g.stroke(); }
  else if (kind === 'concept') { g.beginPath(); g.moveTo(0, -48); g.lineTo(48, 0); g.lineTo(0, 48); g.lineTo(-48, 0); g.closePath(); g.fillStyle = '#141414'; g.fill(); g.lineWidth = 6; g.strokeStyle = '#fff'; g.stroke(); }
  else if (kind === 'hub') { g.beginPath(); g.arc(0, 0, 56, 0, 7); g.fillStyle = COL.platform; g.fill(); g.lineWidth = 9; g.strokeStyle = '#141414'; g.stroke(); g.beginPath(); g.arc(0, 0, 18, 0, 7); g.fillStyle = '#141414'; g.fill(); }
  else { g.beginPath(); g.arc(0, 0, 22, 0, 7); g.fillStyle = '#141414'; g.fill(); g.lineWidth = 8; g.strokeStyle = '#fff'; g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const TEXS = {}; ['view', 'platform', 'border', 'back', 'concept', 'hub', 'dot'].forEach(k => TEXS[k] = spriteTex(k));
const nodes = D.nodes.map(n => {
  const kind = n.hub ? 'hub' : n.concept ? 'concept' : (n.threads[0] || 'dot');
  const mat = new THREE.SpriteMaterial({ map: TEXS[kind], transparent: true, depthTest: false, opacity: 0 });
  const sp = new THREE.Sprite(mat); sp.renderOrder = 10;
  const s = kind === 'hub' ? 64 : kind === 'dot' ? 20 : kind === 'concept' ? 32 : 30; sp.scale.set(s, s, 1); sp.userData.n = n.i;
  scene.add(sp);
  const el = document.createElement('div'); el.className = 'lab' + (n.pal ? ' pal' : ''); el.textContent = n.title;
  const lab = new CSS2DObject(el); lab.center.set(0.5, 1.6); scene.add(lab);
  return { ...n, sp, mat, el, lab, op: 0, opT: 0 };
});
const P3 = n => W(n.u, n.v, topY(n.L) + 3);

// ---------------------------------------------------------------- threads
const threads = D.threads.map(t => {
  const m = new THREE.MeshBasicMaterial({ color: COL[t.key], transparent: true, opacity: 0 });
  const mc = new THREE.MeshBasicMaterial({ color: 0x141414, transparent: true, opacity: 0, side: THREE.BackSide });
  const mesh = new THREE.Mesh(new THREE.BufferGeometry(), m); mesh.renderOrder = 5;
  const casing = t.key === 'platform' ? new THREE.Mesh(new THREE.BufferGeometry(), mc) : null;
  scene.add(mesh); if (casing) scene.add(casing);
  return { ...t, m, mc, mesh, casing, op: 0, opT: 0 };
});
function curveOf(seq) {
  const path = new THREE.CurvePath();
  const pts = seq.map(i => P3(nodes[i]));
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], dy = b.y - a.y;
    const c1 = new THREE.Vector3(a.x + (b.x - a.x) * .18, a.y + dy * .5, a.z + (b.z - a.z) * .18);
    const c2 = new THREE.Vector3(b.x - (b.x - a.x) * .18, b.y - dy * .5, b.z - (b.z - a.z) * .18);
    if (Math.abs(dy) < 1) { c1.y += 14; c2.y += 14; }
    path.add(new THREE.CubicBezierCurve3(a, c1, c2, b));
  }
  return path;
}
const plumbM = new THREE.LineBasicMaterial({ color: 0xE2BC12, transparent: true, opacity: 0 });
const plumb = new THREE.LineSegments(new THREE.BufferGeometry(), plumbM); scene.add(plumb);
const plumbDots = nodes.filter(n => n.pal && !n.hub && n.L !== 5).map(n => { const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: TEXS.platform, transparent: true, opacity: 0 })); sp.scale.set(11, 11, 1); scene.add(sp); return { n, sp }; });
let threadsBuilt = -1;
function rebuild(full) {
  layers.forEach((l, L) => { l.grp.position.y = layerY(L); l.lab.position.copy(W(WT + 30, DEP * 0.55, topY(L))); });
  nodes.forEach(n => { const p = P3(n); n.sp.position.copy(p); n.lab.position.copy(p); });
  if (full || threads.some(t => t.op > 0.01)) {
    threads.forEach(t => {
      const c = curveOf(t.seq), seg = t.seq.length * 40;
      t.mesh.geometry.dispose(); t.mesh.geometry = new THREE.TubeGeometry(c, seg, THREAD_W[t.key] * .5, 6, false);
      if (t.casing) { t.casing.geometry.dispose(); t.casing.geometry = new THREE.TubeGeometry(c, seg, THREAD_W[t.key] * .5 + 1.4, 6, false); }
    });
  }
  const arr = [];
  plumbDots.forEach(({ n, sp }) => { const p = P3(n); const b = W(n.u, n.v, topY(5) + 1); arr.push(p.x, p.y, p.z, b.x, b.y, b.z); sp.position.copy(b); });
  plumb.geometry.dispose(); plumb.geometry = new THREE.BufferGeometry(); plumb.geometry.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
  cityLabs.forEach(c => c.o.position.copy(W(c.u, c.v, topY(5))));
  const tk = [];
  ticks.forEach(t => { const a = W(t.u, t.v - 34, topY(5) - THICK(5) * 0.5), b = W(t.u, t.v - 12, topY(5) - THICK(5) * 0.5); t.o.position.copy(W(t.u, t.v, topY(5) - THICK(5) * 0.5)); tk.push(a.x, a.y, a.z, b.x, b.y, b.z); });
  tickLine.geometry.dispose(); tickLine.geometry = new THREE.BufferGeometry(); tickLine.geometry.setAttribute('position', new THREE.Float32BufferAttribute(tk, 3));
}
rebuild(true);

// ---------------------------------------------------------------- camera helpers
const DEG = Math.PI / 180;
let anim = null;
function framing(pts, az, el, pad = 1.15, lift = 0, shift) {

  tickLine.material.opacity = ticks[0].el.classList.contains('on') ? (layers[5].op > 0.5 ? 1 : 0.3) : 0;
  updateHUD();
  threads.forEach(t => { t.op = lerp(t.op, t.opT, k); t.m.opacity = t.op; if (t.casing) t.mc.opacity = t.op; t.mesh.visible = t.op > 0.01; if (t.casing) t.casing.visible = t.op > 0.01; });
  nodes.forEach(n => { n.op = lerp(n.op, n.opT, k); n.mat.opacity = n.op; });
  plumbM.opacity = lerp(plumbM.opacity, state.intro ? 0 : (plumbM.userData.opT ?? .9), k);
  plumbDots.forEach(d => d.sp.material.opacity = plumbM.opacity);
  hoverBox.material.opacity = lerp(hoverBox.material.opacity, hoverBox.userData.opT || 0, 0.25);
  controls.update();
  renderer.render(scene, camera); labelR.render(scene, camera);
}
requestAnimationFrame(tick);
</script>
</body>
